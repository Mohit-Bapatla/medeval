services:
  db:
    image: pgvector/pgvector:pg16
    container_name: medeval-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medeval}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medeval_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-medeval}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - medeval_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medeval} -d ${POSTGRES_DB:-medeval}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  medeval_postgres_data:
